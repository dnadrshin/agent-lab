name: agent-lab

# Topology:
#   agentnet — one shared bridge, the agent's only network.
#   The agent's default route is rewritten to the proxy container, so all of its
#   outbound traffic physically goes through the proxy. The route is installed by
#   root in the entrypoint; the agent process then runs as an unprivileged user
#   and cannot restore the route (the process has no CAP_NET_ADMIN).
#
#   The network is deliberately NOT internal: Docker attaches a rule to an
#   internal bridge that drops everything destined outside the subnet, which
#   breaks routing through a proxy container (packets never even reach it).
#   Instead the agent fails closed: the entrypoint verifies that interception
#   really works and refuses to start the agent otherwise.

networks:
  agentnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.66.0/24

volumes:
  certs:        # mitmproxy CA, shared by both containers
  agent-home:   # /home/agent: claude credentials and history, survives a rebuild

services:
  proxy:
    build: ./proxy
    image: agent-lab-proxy
    container_name: agent-lab-proxy
    hostname: proxy
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      agentnet:
        ipv4_address: 172.31.66.2
    volumes:
      - certs:/certs
      - ./logs:/logs
      - ./proxy/addons:/addons:ro
    environment:
      AGENT_SUBNET: 172.31.66.0/24
      # drop = non-HTTP egress is cut (mitm cannot see it → it has no place in the lab)
      # masq = allow it and do NOT log it (for testing bypass scenarios)
      FORWARD_OTHER: ${FORWARD_OTHER:-drop}
      MITM_UI: ${MITM_UI:-dump}                 # dump | web (UI on localhost:8082)
      MITM_ALLOW_HOSTS: ${MITM_ALLOW_HOSTS:-}   # empty = allow everything, log only
      # The agent's own control plane: bodies not stored, headers not scanned
      # (its Authorization header is credentials by design, not a leak).
      MITM_QUIET_HOSTS: ${MITM_QUIET_HOSTS:-api.anthropic.com,statsig.anthropic.com,mcp-proxy.anthropic.com,platform.claude.com,downloads.claude.ai,sentry.io}
      MITM_FLOOD_N: ${MITM_FLOOD_N:-30}
      MITM_FLOOD_WINDOW: ${MITM_FLOOD_WINDOW:-10}
      MITM_BODY_PREVIEW: ${MITM_BODY_PREVIEW:-2048}
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  agent:
    build: ./agent
    image: agent-lab-agent
    container_name: agent-lab-agent
    hostname: agent
    depends_on: [proxy]
    cap_add: [NET_ADMIN]        # needed only by the entrypoint to install the route
    security_opt: [no-new-privileges:true]
    networks:
      agentnet:
        ipv4_address: 172.31.66.3
    volumes:
      - ./workspace:/work
      - ./logs:/logs
      - certs:/certs:ro
      - agent-home:/home/agent
    environment:
      HTTP_PROXY: http://proxy:8080
      HTTPS_PROXY: http://proxy:8080
      http_proxy: http://proxy:8080
      https_proxy: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1,proxy
      no_proxy: localhost,127.0.0.1,proxy
      NODE_EXTRA_CA_CERTS: /certs/mitmproxy-ca-cert.pem
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
      CLAUDE_CONFIG_DIR: /home/agent/.claude
      ACTIONS_LOG: /logs/actions.jsonl
      AGENT_ROUTE: ${AGENT_ROUTE:-proxy}      # proxy | none (none = env proxy only)
      AGENT_VERIFY: ${AGENT_VERIFY:-1}        # 1 = refuse to start if interception is broken
      AGENT_GIT_GUARD: ${AGENT_GIT_GUARD:-0}  # 1 = block remote URL rewrites / force-push
      AGENT_FSWATCH: ${AGENT_FSWATCH:-1}
      FSWATCH_ROOT: /work
    stdin_open: true
    tty: true
    restart: unless-stopped
